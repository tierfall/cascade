name: gitnexus-refresh

on:
  schedule:
    # Weekly on Mondays at 06:00 UTC. AGENTS.md / STRUCTURE.md drift the slowest
    # of any generated artifact in this repo, so a weekly cadence is enough to
    # keep them aligned without making the bot the loudest contributor.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v6
        with: { version: 10.33.0 }
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client (gitnexus indexes generated code too)
        run: pnpm --filter cascade-api exec prisma generate
      - name: Run gitnexus analyze
        run: npx gitnexus analyze
      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet -- AGENTS.md docs/STRUCTURE.md 2>/dev/null; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Open PR if AGENTS.md / STRUCTURE.md changed
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/gitnexus-refresh
          base: develop
          delete-branch: true
          commit-message: 'chore: refresh AGENTS.md and STRUCTURE.md from gitnexus'
          title: 'chore: refresh gitnexus-generated docs'
          body: |
            Automated weekly refresh of `AGENTS.md` and `docs/STRUCTURE.md`
            generated by `npx gitnexus analyze`. Review the diff, merge if it
            looks sensible.
          labels: |
            area:infra
            type:chore

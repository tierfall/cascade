name: release

on:
  push:
    tags: ['v*.*.*']

jobs:
  github-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v6
        with: { version: 10.33.0 }
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate notes from Conventional Commits between tags
        run: |
          # nx release changelog renders the markdown using @nx/release's
          # conventional-commit parser and the previous semver tag as the base.
          # --tag-version-prefix='' so it matches our `v1.2.3` tag scheme.
          pnpm exec nx release changelog "${GITHUB_REF_NAME}" \
            --dry-run=false \
            --create-release=github \
            --git-push=false \
            --git-tag=false \
            --git-commit=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: github-release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v6
        with: { version: 10.33.0 }
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter cascade-api exec prisma generate
      - run: pnpm exec nx run-many -t build
      - run: pnpm exec nx release publish --skip-publish=false
        env:
          NPM_CONFIG_PROVENANCE: true
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-ghcr:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [cascade-api, cascade-web, cascade-docs]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ghcr.io/tierfall/${{ matrix.app }}:${{ github.ref_name }}
            ghcr.io/tierfall/${{ matrix.app }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
